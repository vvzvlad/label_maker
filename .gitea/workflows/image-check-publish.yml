name: Docker Image CI

# No `pull_request` trigger on purpose: this workflow pushes :latest for both images, and
# both are live (`labeler` behind labeler.asakusa-lab.cc, `labeler-offline` on asakusa-infra,
# called by the Telegram print bot). PRs are covered by tests.yml, which never pushes.
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

# `packages: write` has no effect on Gitea; the push authenticates with the REGISTRY_TOKEN
# PAT (an organisation secret on `projects`).
permissions:
  contents: read   # checkout

# Serialises runs on one ref so the newest commit's :latest is written last. Cancelling is
# off: it would kill the older run before its :<sha> image exists, leaving gaps in the
# rollback history. One group covers both matrix legs.
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # Must stay above the sum of the step budgets (30 build + 10 smoke + 15 push = 55) plus
    # the unbudgeted steps: a job-level timeout kills the whole job, so the log dump and the
    # `always()` cleanups never run, while a step timeout lets them run.
    timeout-minutes: 60
    strategy:
      # Two images from one tree; every step reads from this matrix. `suffix` gives the
      # `label_maker-backend` image path. `expect_pdf_api` is passed to ci/smoke.py:
      # Dockerfile.backend sets `ENV ENABLE_PDF_API=1`, which registers
      # `POST /api/generate-pdf` in src/api.py, so the check catches swapped images.
      # fail-fast off: the images are independent deployments.
      fail-fast: false
      matrix:
        include:
          - name: label_maker
            dockerfile: Dockerfile
            suffix: ""
            expect_pdf_api: "0"
          - name: label_maker-backend
            dockerfile: Dockerfile.backend
            suffix: "-backend"
            expect_pdf_api: "1"
    steps:
    - uses: actions/checkout@v7

    - name: Compute image tags
      id: tags
      # main -> :latest + :<sha>; any other branch (via workflow_dispatch) -> :<branch>.
      env:
        # Through the environment, not interpolated into the script: branch names may
        # contain `$(...)`, and the runner is self-hosted with the host's docker socket.
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        # "" for the plain image, "-backend" for the playwright one.
        SUFFIX: ${{ matrix.suffix }}
      run: |
        # Docker rejects uppercase letters in an image path.
        IMAGE="gitea.vvzvlad.xyz/$(printf '%s' "$REPO" | tr 'A-Z' 'a-z')$SUFFIX"
        if [ "$REF_NAME" = "main" ]; then
          # Order matters: the push step goes left to right, so :latest moves only after
          # :<sha> (the rollback point) is in the registry.
          echo "tags=$IMAGE:$SHA $IMAGE:latest" >> "$GITHUB_OUTPUT"
          # The smoke gate tests the :<sha> tag, which can only mean this commit's image.
          echo "smoke=$IMAGE:$SHA" >> "$GITHUB_OUTPUT"
        else
          # Legal docker tag: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}. Illegal characters become
          # `-`, an illegal first character becomes `_`, length is capped at 100.
          branch_tag=$(printf '%s' "$REF_NAME" | tr -c 'A-Za-z0-9_.-' '-' | sed 's/^[^A-Za-z0-9_]/_/' | cut -c1-100)
          # A branch named `latest` must not produce the production tag.
          if [ "$branch_tag" = "latest" ]; then
            branch_tag="branch-latest"
          fi
          echo "tags=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
          echo "smoke=$IMAGE:${branch_tag}" >> "$GITHUB_OUTPUT"
        fi

    - name: Build the Docker image
      # Sized for the backend leg: `playwright install --with-deps chromium` pulls apt
      # packages and a ~150 MB browser on a cold cache.
      timeout-minutes: 30
      env:
        # `$TAGS` is a space-separated list and is left unquoted below so it word-splits.
        TAGS: ${{ steps.tags.outputs.tags }}
        # Dockerfile or Dockerfile.backend, straight from the matrix.
        DOCKERFILE: ${{ matrix.dockerfile }}
      run: |
        tag_args=""
        for tag in $TAGS; do tag_args="$tag_args --tag $tag"; done
        # --pull: the self-hosted runner's daemon is persistent, so without it a cached
        # python:3.11-slim base would never be refreshed.
        docker build --pull . --file "$DOCKERFILE" $tag_args

    - name: Smoke-test the built image
      # The only gate before :latest; it sits between build and push, so a red smoke
      # publishes nothing.
      #
      # The container runs the image's own CMD (no `--entrypoint`, which would drop CMD),
      # so startup itself is tested. On the backend leg src/api.py launches chromium in
      # the FastAPI lifespan hook, so a broken `playwright install` fails startup.
      #
      # Checks run via `docker exec`, nothing is published to the host. The container name
      # carries the run id and the matrix suffix because both legs share one daemon.
      #
      # The `run:` body is byte-identical to the one in tests.yml.
      #
      # Budget: ~2 min readiness worst case plus ci/smoke.py, which on the backend leg
      # drives a full page render under its own 60 s PDF_RENDER_TIMEOUT.
      timeout-minutes: 10
      env:
        SMOKE_TAG: ${{ steps.tags.outputs.smoke }}
        NAME: label-maker-smoke-${{ github.run_id }}${{ matrix.suffix }}
        # "0" for the plain image, "1" for the backend one; passed as an environment
        # variable because ci/smoke.py is fed over stdin unmodified.
        EXPECT_PDF_API: ${{ matrix.expect_pdf_api }}
      run: |
        docker run -d --name "$NAME" "$SMOKE_TAG"

        # Port 8000 is main.py's default when PORT is unset.
        #
        # Ready means any HTTP response, error statuses included: judging it is
        # ci/smoke.py's job. HTTPError counts as ready; connection refused or a timeout
        # does not.
        #
        # The program needs real newlines (try/except), so it lives in a single-quoted
        # shell variable at the block's base indentation, which YAML strips.
        PROBE='
        import urllib.error
        import urllib.request
        try:
            urllib.request.urlopen("http://127.0.0.1:8000/", timeout=2)
        except urllib.error.HTTPError:
            pass
        '
        ready=""
        for _ in $(seq 1 30); do
          if docker exec "$NAME" python -c "$PROBE" >/dev/null 2>&1; then
            ready=1
            break
          fi
          # An exited container never becomes ready; typical for the backend image when
          # chromium cannot launch in the lifespan hook.
          if [ "$(docker inspect -f '{{.State.Running}}' "$NAME")" != "true" ]; then
            break
          fi
          sleep 1
        done

        if [ -z "$ready" ]; then
          echo "container produced no HTTP response at all on 127.0.0.1:8000 in 30 attempts (~35-45s when the port is refused outright, up to ~2 min when something accepts the connection and then never answers) — not even an error status (it exited, or nothing ever listened); container logs:"
          # The cleanup step removes the container, so print the logs now.
          docker logs "$NAME"
          exit 1
        fi

        # Fed over stdin, so the image does not carry the test file. `-e` tells the
        # script which of the two images it is testing.
        if ! docker exec -e EXPECT_PDF_API="$EXPECT_PDF_API" -i "$NAME" python - < ci/smoke.py; then
          echo "smoke failed; container logs:"
          docker logs "$NAME"
          exit 1
        fi

    - name: Log in to the Gitea container registry
      # Logged in only after build and smoke, which run third-party code on a runner with
      # the host's docker socket, so the credentials are not in the docker config then.
      uses: docker/login-action@v4
      with:
        registry: gitea.vvzvlad.xyz
        username: ${{ github.repository_owner }}
        # PAT with `write:package`, an organisation secret on `projects`; a repo-level
        # secret of the same name would shadow it. GITEA_TOKEN has no package scope.
        password: ${{ secrets.REGISTRY_TOKEN }}

    - name: Push Docker images
      # The backend image is about a gigabyte; the bound keeps a stalled push from holding
      # a slot on the shared runner.
      timeout-minutes: 15
      env:
        # Unquoted below so it word-splits, keeping the :<sha>-before-:latest order.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker push "$tag"; done

    - name: Dump the smoke container logs
      # When the smoke step hits its timeout, its own `docker logs` branches never run and
      # the cleanup step deletes the container; this step runs before the cleanup.
      # `|| true` covers runs where no container was created; `2>&1` because uvicorn and
      # playwright log to stderr. `--tail 500`: a hung render logs a warning per failed
      # request, and the cause is at the end.
      if: failure()
      env:
        # Same name as in the smoke step and the cleanup step, suffix included.
        NAME: label-maker-smoke-${{ github.run_id }}${{ matrix.suffix }}
      run: |
        docker logs --tail 500 "$NAME" 2>&1 || true

    - name: Remove the smoke container from the runner
      # The runner's docker daemon is persistent and shared; a leftover container would
      # also pin the image and make the `docker rmi` below fail.
      if: always()
      env:
        # Must match the smoke step's name exactly, suffix included, or one leg would
        # delete the other's container.
        NAME: label-maker-smoke-${{ github.run_id }}${{ matrix.suffix }}
      run: |
        docker rm -f "$NAME" || true

    - name: Remove the built images from the runner
      # Removes only this run's tags (no `docker system prune`: the daemon is shared).
      # The BuildKit cache and dangling base images left by `--pull` are not reclaimed
      # here and need a periodic cleanup on the runner host.
      if: always()
      env:
        # Unquoted below so it word-splits into items.
        TAGS: ${{ steps.tags.outputs.tags }}
      run: |
        for tag in $TAGS; do docker rmi "$tag" || true; done
